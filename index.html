<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>Julia's Training</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="signin" class="signin hidden">
    <h1>Julia's Training</h1>
    <button id="signin-btn" class="primary">Sign in with Google</button>
  </div>

  <main id="app" class="hidden">
    <header id="phase-strip" class="phase-strip"></header>
    <section id="tab-strength" class="tab hidden"></section>
    <section id="tab-prehab" class="tab hidden"></section>
    <section id="tab-mobility" class="tab hidden"></section>
    <section id="tab-tracking" class="tab hidden"></section>
    <section id="tab-skills" class="tab hidden"></section>
    <section id="tab-tempo" class="tab hidden"></section>
    <nav class="tabbar">
      <!-- Strength and Tracking are hidden (unused); their code is kept intact.
           Re-add their buttons here to bring them back. -->
      <button data-tab="prehab" class="tabbtn active">Pre-hab</button>
      <button data-tab="mobility" class="tabbtn">Mobility</button>
      <button data-tab="skills" class="tabbtn">Skills</button>
      <button data-tab="tempo" class="tabbtn">Tempo</button>
    </nav>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
