<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>Julia's Training</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="signin" class="signin hidden">
    <h1>Julia's Training</h1>
    <button id="signin-btn" class="primary">Sign in with Google</button>
  </div>

  <main id="app" class="hidden">
    <header id="phase-strip" class="phase-strip"></header>
    <section id="tab-strength" class="tab"></section>
    <section id="tab-prehab" class="tab hidden"></section>
    <section id="tab-tracking" class="tab hidden"></section>
    <nav class="tabbar">
      <button data-tab="strength" class="tabbtn active">Strength</button>
      <button data-tab="prehab" class="tabbtn">Pre-hab</button>
      <button data-tab="tracking" class="tabbtn">Tracking</button>
    </nav>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
